# └───────────────────────────────────────────────────┘
#
# SYNC FEEDBACK SENSOR/BUFFER: Sync feedback sensors often called "buffers" are used to synchronize MMU gear stepper
# movement with the extruder. They will typically have a tension switch (most important) or both tension and compression.
# Note that compression switch is useful for use as a endstop to detect hitting the extruder entrance
#
#   'tension_pin'     .. pin for switch activated when filament is under tension
#   'compression_pin' .. pin for switch activated when filament is under compression
#
# Pin configuration is flexible: Simply define pins for any sensor you want to enable, if pin is empty it will be
# ignored so no need to comment out what you are not using
#
# Possible buffer setups, The forth option is for types where neutral is when both sensors are active:
#
#   <------maxrange------>       <------maxrange------>       <------maxrange------>       <------maxrange------>
#        <--range--->                  <----range----->       <----range----->                       <> range=0
#   |====================|       |====================|       |====================|       |====================|
#        ^          ^                  ^                                     ^                       ^^
#   compression   tension        compression-only                      tension-only
#
[mmu_buffer unit0]
buffer_range            : 8		# Travel in "buffer" between compression/tension or one sensor and end (see above)
buffer_maxrange         : 12		# Absolute maximum end-to-end travel (mm) provided by buffer (see above)

tension_pin             : ^unit0:PB0

# If the buffer is sprung and reliably rests in one position it can be set here. This aids filament detection
# logic. If 'none' (default) no assumption will be made about resting position.
#
buffer_spring_state     : tension		# Default state: none|tension|neutral|compression

# Proportional sync feedback sensor configuration. Leave empty if not fitted.
# (if you have a proportional sensor the sync_feedback_tension_pin and sync_feedback_compression_pin would likely be empty)
#analog_pin              : pin		# The ADC pin where the proportional filament pressure sensor is installed
#analog_max_compression  : 1		# Raw sensor reading at max filament compression (buffer squeezed)
#analog_max_tension      : 0		# Raw sensor reading at max filament tension (buffer expanded)
#analog_neutral_point    : 0.5		# Biasing of neutral point (sensor value 0). Normally close to 0.5
#analog_gamma            : 1		# Hidden option to change the "shape" the response around neutral_point
#analog_sensor_threshold : 0.9		# The point at which the virtual compression/tension sensors are triggered

# Whether to register the sensors for visibility in klipper UI's and with QUERY_SENSOR command
register_buffer_sensors : 1



