[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_AD8E32373534350534343539-if00
restart_method: command

[mcu THR]
serial: /dev/ttyS4
restart_method: command
baud: 500000

[temperature_sensor Host]
sensor_type: temperature_host
min_temp: 0
max_temp: 98

[temperature_sensor _Mainboard_MCU]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor Toolhead_MCU]
sensor_type: temperature_mcu
sensor_mcu: THR
min_temp: 0
max_temp: 100

[danger_options]
log_velocity_limit_changes: False
log_pressure_advance_changes: False
