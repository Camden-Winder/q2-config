[gcode_macro PRINT_END]
gcode:
    SET_SKEW CLEAR=1
    M400
    save_zoffset
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    CLEAR_PAUSE
    M106 P2 S0
    M106 P0 S0
    # M106 P3 S0

    M104 S0
    M140 S0
    M141 S0

    M220 S100
    M221 S100

    # Park at the trash chute, then drop the bed (BunnyBox positions).
    # Must run before M84: M84 is redefined in motion-control.cfg to unpower
    # each stepper individually, so any move after it would fail.
    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        G1 Z5 F900
        G90
        MOVE_TO_TRASH
        M400
        G1 Z251 F600
        M400
    {% endif %}

    M84

    DISABLE_ALL_SENSOR
#    SET_GCODE_OFFSET Z=0 MOVE=0
    BED_MESH_CLEAR
    G31
    # CLEAR_LAST_FILE removed (QIDI vendor-only).
    BEEP I=2 DUR=500
  BEEP I=2 DUR=500 # Beep
  UPDATE_DELAYED_GCODE ID=CLEAR_FILE_CUSTOM DURATION=2
  M84

[delayed_gcode CLEAR_FILE_CUSTOM]
gcode:
    SDCARD_RESET_FILE
