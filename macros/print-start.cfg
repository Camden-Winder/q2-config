[gcode_macro PRINT_START]
gcode:
    SKIP_COOLDOWN
    AUTOTUNE_SHAPERS
    DISABLE_ALL_SENSOR
    CLEAR_PAUSE
    AUTOTUNE_SHAPERS
    {% set bedtemp = params.BED|default(60)|int %}
    {% set hotendtemp = params.HOTEND|default(200)|int %}
    {% set chambertemp = params.CHAMBER|default(0)|int %}
    {% set boxtemp = params.BOX|default(printer.save_variables.variables.get('saved_box_temp', 45)|int)|int %}
    {% set material = params.MATERIAL|default("")|string|upper %}

    _CHECK_MATERIAL_BOX_LIMIT MATERIAL={material} BOX_TARGET={boxtemp}

    SET_BOX_TEMP TEMP={boxtemp}

    # Set Heaters - Nonblocking
	{% set chambertemp = params.CHAMBER|default(0)|float %}
	{% if chambertemp > 0 %}
	    M117 Heating Chamber
	    M118 Heating chamber to {chambertemp}C
	    M141 S{chambertemp}	# Heat Chamber (nonblocking)
	{% else %}
	    M117 No Chamber Heat
	{% endif %}
	
    M140 S{bedtemp}     # Heat Bed (nonblocking)
    M117 Heat Bed
    M118 Heat Bed
    M104 S{100}         # Set nozzle to 100

    # Cool nozzle to 140°C before Z_TILT_ADJUST to prevent ooze blobs during calibration.
    # M109 (blocking) ensures nozzle is actually at 140 before tilt runs. Part cooling fan speeds cooling.
    M106 S255
    M109 S140
    M106 S0
    M117 Start Home
    M118 Start Home
    G28
    M117 Start Tilt Adjust
    M118 Start Tilt Adjust
    G90
    G1 X135 Y135 F7800
    Z_TILT_ADJUST
    M117 Home Z
    M118 Home Z
    G28 Z

    # Chamber and/or Bed set
    {% if chambertemp == 0 %} # If chambertemp is 0
        M190 S{bedtemp}       # Only turn on the bed
        M117 Wait for Bed
        M118 Wait for Bed
    {% else %}
        M140 S{bedtemp}      # Set bedtemp to print input, nonblocking 
        # G1 X261 Y9 F7500   # Move to Home
        M106 P2 S225         # Use the aux fan to circulate air
        M117 Wait for Chamber
        M118 Wait for Chamber
        M191 S{chambertemp}  # Wait for chamber temperature (blocking)
        M117 Wait for Bed
        M118 Wait for Bed
        M190 S{bedtemp}      # Wait for bed temperature (blocking)
        M106 P2 S0           # Turn aux fan back off
    {% endif %}
    G28
    SET_GCODE_OFFSET Z=0 MOVE=0
    # QIDI-box print-start block removed (BUFFER_MONITORING / BOX_PRINT_START /
    # box save-variables are vendor-only; Happy-Hare manages the MMU).

    CLEAR_NOZZLE HOTEND={hotendtemp}
    #切料调平
    # CUT_FILAMENT_1
    M104 S140
    G4 P3000
    M400
    G28    
    Z_TILT_ADJUST
    
    M117 Cleaning Nozzle
    M118 Cleaning Nozzle
    _PRINT_START_CLEAR_NOZZLE HOTEND={hotendtemp}

    M117 Adaptive Bed Mesh
    M118 Start Mesh
    BED_MESH_CALIBRATE PROFILE=adaptive

    M117 Heat Nozzle
    M118 Heat Nozzle
    M109 S{hotendtemp}
    M204 S10000

    set_zoffset
    ENABLE_ALL_SENSOR
    # save_last_file removed (QIDI vendor-only macro).
    M117 Print Started
    M118 Print Starting


[gcode_macro _PRINT_START_CLEAR_NOZZLE]
description: Print-start purge and clean, never heats above 140C (or HOTEND if lower) — reheat to print temp happens later in PRINT_START, after the mesh
gcode:
    {% set hotendtemp = params.HOTEND|default(200)|int %}
    {% set clean_temp = [hotendtemp, 140]|min %}
    BOX_MOVE_TO_TRASH
    M400

    M117 Purge: Heating...
    M109 S{clean_temp}

    BOX_CLEAR_FLUSH
    BOX_CLEAR_OOZE
    G1 Z30 F900
    G1 Y10 F18000
    G1 X260 F18000
    M106 S0

    M117 Nozzle clean, holding at {clean_temp}C for probing...
    SKEW_PROFILE LOAD=Calilantern
[gcode_macro ENABLE_ALL_SENSOR]
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_switch_sensor ENABLE=1
[gcode_macro DISABLE_ALL_SENSOR]
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_switch_sensor ENABLE=0
